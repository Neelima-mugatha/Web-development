<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <script src="calculator.js"></script>
</head>
<body>
    <center>
<div style="border:2px solid black;border-radius: 10px; box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px, rgba(0, 0, 0, 0.06) 0px 0px 0px 1px;
margin-left: 30px; margin-top: 30px; width: 50%; height: auto; display: grid;">
    <input type="text" placeholder="0" height="150px" style="width: 50%; margin: auto; padding: 10px; font-size: 20px; border: 2px solid black; border-radius: 10px; margin-top: 15px;">
    <div id="step1"style= "grid-template-columns:repeat(4, 2fr); height : 50px; width: 50%; margin : auto;padding : 10px;">
    <input type="button" value="1">
    <input type="button" value="2">
    <input type="button" value="3">
    <input type="button" value="+">
    </div>
    <div id="step2" style="grid-template-columns:repeat(4, 2fr);height : 50px; width: 50%; padding: 10px;margin : auto">
    <input type="button" value="4">
    <input type="button" value="5">
    <input type="button" value="6">
    <input type="button" value="-">
    </div>
    <div id="step3" style="grid-template-columns:repeat(4, 2fr);height : 50px; width: 50%; padding: 10px;margin : auto">
    <input type="button" value="7">
    <input type="button" value="8">
    <input type="button" value="9">
    <input type="button" value="*">
    </div>
    <div id="step4" style="grid-template-columns:repeat(4, 2fr);height : 50px; width: 50%; padding: 10px; margin-bottom: 10px;margin : auto" >
    <input type="button" value="0">
    <input type="button" value=".">
    <input type="button" value="=">
    <input type="button" value="/">
    </div>
</div>
</div>
</center>
</body>
</html>
